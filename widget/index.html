<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget demo store</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #222; background: #fafaf8; }
      header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #fff; border-bottom: 1px solid #e5e5e0; }
      main { max-width: 860px; margin: 0 auto; padding: 32px 24px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
      .tile { background: #fff; border: 1px solid #e5e5e0; border-radius: 10px; padding: 16px; min-height: 120px; }
      code { background: #eee; padding: 1px 5px; border-radius: 4px; }
      label { font-size: 14px; }
    </style>
  </head>
  <body>
    <header>
      <strong>Demo store</strong>
      <span>Cart: <span id="cart-count">0</span> items</span>
    </header>
    <main>
      <h1>Widget demo host page</h1>
      <p>
        The chat bubble is in the bottom-right corner. It talks to agent-service at
        <code>http://localhost:8000</code> (start it with <code>CORS_ORIGINS=http://localhost:5173</code>).
      </p>
      <p>
        <label>Shopper JWT (leave empty to chat as a guest):
          <input id="token" size="40" placeholder="paste a token from commerce-api /auth/login" />
        </label>
      </p>
      <div class="grid">
        <div class="tile">Trail shoes</div>
        <div class="tile">Rain jackets</div>
        <div class="tile">Backpacks</div>
        <div class="tile">Headphones</div>
      </div>
    </main>

    <script>
      // Host integration (ARCHITECTURE.md §4.3). A real store would fetch('/session/token').
      window.ShopChat = { getToken: () => document.getElementById('token').value.trim() || null };
      window.addEventListener('shopchat:cart-updated', (e) => {
        document.getElementById('cart-count').textContent = e.detail?.itemCount ?? 0;
      });
    </script>
    <!-- In production: <script src="https://chat.yourstore.com/v1/widget.js" data-store="main" async></script> -->
    <script
      type="module"
      src="/src/index.ts"
      data-shopchat
      data-store="demo"
      data-api="http://localhost:8000"
      data-help-url="http://localhost:5173/help"
    ></script>
  </body>
</html>
