name: commerce-api

on:
  push:
    branches: [main]
    paths: ["commerce-api/**", ".github/workflows/commerce-api.yml"]
  pull_request:
    paths: ["commerce-api/**", ".github/workflows/commerce-api.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: commerce-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # e2e global setup creates shop_test and runs the migrations (test/global-setup.ts).
      TEST_DATABASE_URL: postgresql://shop:shop@localhost:5432/shop_test
      # CPU only: skip onnxruntime's CUDA download during npm ci (embedding model, src/search/).
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: commerce-api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: Integration tests (real Postgres, seeded per test)
        run: npm run test:e2e
      - name: Seed and embed with the real model (pgvector)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          NODE_ENV: development
        run: |
          node dist/database/seed.js
          # A second run must find nothing to do: every row has a current embedding.
          node dist/database/embed.js | tee embed.log
          grep -q "products: 0 embedded, .* faq: 0 embedded" embed.log
      - name: Entities match migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run typeorm -- migration:generate src/database/migrations/Check --check
