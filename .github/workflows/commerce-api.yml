name: commerce-api

on:
  push:
    branches: [main]
    paths: ["commerce-api/**", ".github/workflows/commerce-api.yml"]
  pull_request:
    paths: ["commerce-api/**", ".github/workflows/commerce-api.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: commerce-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # e2e global setup creates shop_test and runs the migrations (test/global-setup.ts).
      TEST_DATABASE_URL: postgresql://shop:shop@localhost:5432/shop_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: commerce-api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: Integration tests (real Postgres, seeded per test)
        run: npm run test:e2e
      - name: Entities match migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm run typeorm -- migration:generate src/database/migrations/Check --check
