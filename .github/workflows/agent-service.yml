name: agent-service

# Lint, types and unit tests on every agent-service change. The eval suites (real model against
# a seeded commerce-api) run when the prompt, tools, model config, evals or seed data change,
# or on demand. Both suites must meet their bar: golden ≥ 90%, red team 100% (AGENT.md §8).
# Needs the ANTHROPIC_API_KEY repository secret (a DeepSeek key; see agent-service/app/config.py).

on:
  push:
    branches: [main]
    paths: ["agent-service/**", "commerce-api/src/**", ".github/workflows/agent-service.yml"]
  pull_request:
    paths: ["agent-service/**", "commerce-api/src/**", ".github/workflows/agent-service.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: agent-service

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app evals tests
      - run: pytest

  changes:
    runs-on: ubuntu-latest
    outputs:
      evals: ${{ steps.diff.outputs.evals }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # What the agent sees or does: prompt, tools, loop, model config, evals, seed data.
          pattern='^(agent-service/(app/prompts/|app/tools/|app/(llm|loop|config|guardrails)\.py|evals/|pyproject\.toml)|commerce-api/src/database/seed|\.github/workflows/agent-service\.yml)'
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            evals=true
          elif git diff --name-only "$BASE" HEAD | grep -qE "$pattern"; then
            evals=true
          else
            evals=false
          fi
          echo "evals=$evals" | tee -a "$GITHUB_OUTPUT"

  evals:
    needs: [test, changes]
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # commerce-api (development mode: `seed` refuses production)
      NODE_ENV: development
      DATABASE_URL: postgresql://shop:shop@localhost:5432/shop
      RATE_LIMIT_PER_MIN: "10000"
      LOG_LEVEL: warn
      ONNXRUNTIME_NODE_INSTALL: skip # CPU only: no CUDA download for the embedding model
      # agent-service
      APP_ENV: test
      COMMERCE_API_URL: http://localhost:3000/api/v1
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Require model access
        working-directory: .
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY repository secret (DeepSeek key) to run evals (forked PRs don't get secrets)."
            exit 1
          fi
      - name: Per-run secrets shared by both services
        working-directory: .
        run: |
          jwt=$(openssl rand -hex 32); token=$(openssl rand -hex 32)
          echo "::add-mask::$jwt"; echo "::add-mask::$token"
          { echo "JWT_SECRET=$jwt"; echo "SERVICE_TOKEN=$token"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: commerce-api/package-lock.json
      - name: Start commerce-api on seeded data
        working-directory: commerce-api
        run: |
          npm ci
          npm run build
          npm run migration:run:prod
          node dist/database/seed.js
          nohup node dist/main.js > "$RUNNER_TEMP/commerce-api.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://localhost:3000/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/commerce-api.log"; exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Red team (bar 100%)
        run: python -m evals.run --suite redteam
      - name: Golden (bar 90%)
        if: ${{ !cancelled() }}
        run: python -m evals.run --suite golden
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            agent-service/evals/results/
            ${{ runner.temp }}/commerce-api.log
          retention-days: 30
