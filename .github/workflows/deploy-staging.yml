name: deploy-staging

# Build the three images once, tag them with the commit SHA, deploy them to staging and
# smoke-test. deploy-production.yml later promotes these exact digests.
#
# Manual only until the staging VM exists (infra/README.md, First-time setup). Then restore:
#   push:
#     branches: [main]
#     paths-ignore: ["**.md", "storefront/**"]
#
# Tests and evals gate the merge, not this workflow: protect `main` so the commerce-api,
# agent-service and widget checks must pass on the PR (infra/README.md).

on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling one halfway.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: commerce-api
            context: commerce-api
            file: commerce-api/Dockerfile
          - name: agent-service
            context: agent-service
            file: agent-service/Dockerfile
          - name: edge
            context: .
            file: infra/edge/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true

  deploy:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      sha: ${{ github.sha }}
    secrets: inherit
