# Alerts from ARCHITECTURE.md §8, as Prometheus rules over the metrics agent-service exports
# (app/telemetry.py; OTLP names → Prometheus: agent.tool.calls → agent_tool_calls_total).
# `job` is "<DEPLOY_ENV>/agent-service", so each environment alerts on its own.
#
# Load into: Grafana Cloud / Mimir (`mimirtool rules load alerts.yaml`), or Prometheus
# (`rule_files:`). Check with `promtool check rules alerts.yaml`. Runbooks: README.md.
groups:
  - name: shopchat-agent
    rules:
      - alert: AgentToolErrorRateHigh
        # Store failures only (5xx, 429, unreachable). "Order not found" or a login prompt is
        # status="rejected" and doesn't count. Needs ≥ 20 calls in 5 min so one failure at night
        # doesn't page anyone.
        expr: |
          (
            sum by (job) (rate(agent_tool_calls_total{status="error"}[5m]))
              / sum by (job) (rate(agent_tool_calls_total[5m]))
          ) > 0.05
          and sum by (job) (increase(agent_tool_calls_total[5m])) >= 20
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }}: {{ $value | humanizePercentage }} of tool calls fail"
          description: commerce-api calls from the agent are failing. Check commerce-api health and logs.
          runbook: infra/monitoring/README.md#tool-errors

      - alert: AgentFirstTokenSlow
        expr: |
          histogram_quantile(0.95,
            sum by (job, le) (rate(agent_turn_first_token_seconds_bucket{route="chat"}[10m]))
          ) > 4
          and sum by (job) (increase(agent_turn_first_token_seconds_count{route="chat"}[10m])) >= 20
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }}: p95 first token {{ $value | humanizeDuration }} (target < 4 s)"
          description: Shoppers wait too long for the first words of a reply.
          runbook: infra/monitoring/README.md#slow-first-token

      - alert: AgentModelErrorSpike
        expr: |
          (
            sum by (job) (rate(agent_model_calls_total{status="error"}[5m]))
              / sum by (job) (rate(agent_model_calls_total[5m]))
          ) > 0.10
          and sum by (job) (increase(agent_model_calls_total[5m])) >= 10
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }}: {{ $value | humanizePercentage }} of model calls fail"
          description: >-
            The model API is failing after retries; shoppers see the fallback card. Check the
            provider's status page and the error_type label (status code or connection error).
          runbook: infra/monitoring/README.md#model-errors

      - alert: AgentTurnsFailing
        # Timeouts and crashes (not model outages, which have their own alert).
        expr: |
          (
            sum by (job) (rate(agent_turn_errors_total{error_type=~"internal|timeout"}[10m]))
              / sum by (job) (rate(agent_turn_duration_seconds_count[10m]))
          ) > 0.05
          and sum by (job) (increase(agent_turn_duration_seconds_count[10m])) >= 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }}: {{ $value | humanizePercentage }} of turns time out or crash"
          runbook: infra/monitoring/README.md#failing-turns

      - alert: AgentSuspectFacts
        # Replies quoting a price or percentage that no tool (or the shopper) gave that turn
        # (CLAUDE.md rule 5). Some are harmless (a price from an earlier turn); a rise usually
        # means a prompt or model change. Hourly window: it's a trend, not an outage.
        expr: |
          (
            sum by (job) (increase(agent_output_suspect_replies_total[1h]))
              / sum by (job) (increase(agent_turn_duration_seconds_count{route="chat"}[1h]))
          ) > 0.05
          and sum by (job) (increase(agent_turn_duration_seconds_count{route="chat"}[1h])) >= 50
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }}: {{ $value | humanizePercentage }} of replies state unsourced prices"
          runbook: infra/monitoring/README.md#suspect-facts

      - alert: AgentPhotoDescribeFailing
        # Photos (PLAN-20) the fast model couldn't describe: the call failed or its reply wasn't
        # JSON. The shopper is asked to describe the photo in words, so it's not an outage, but a
        # rise means MODEL_FAST stopped reading images (provider change, timeout, prompt drift).
        expr: |
          (
            sum by (job) (increase(agent_images_total{outcome=~"failed|unparsed"}[30m]))
              / sum by (job) (increase(agent_images_total[30m]))
          ) > 0.20
          and sum by (job) (increase(agent_images_total[30m])) >= 10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }}: {{ $value | humanizePercentage }} of photos couldn't be described"
          runbook: infra/monitoring/README.md#photos

      - alert: AgentFastModelFailing
        # Model routing (PLAN-19 M6): turns that started on the fast model but hit an error and
        # were redone on the main model. Shoppers still get answers (the main model takes over),
        # but those turns pay for two calls. AgentModelErrorSpike pages if both models fail.
        expr: |
          (
            sum by (job) (rate(agent_routes_total{agent_route_reason="fast_error"}[15m]))
              / sum by (job) (rate(agent_routes_total{agent_route_reason="simple"}[15m]))
          ) > 0.05
          and sum by (job) (increase(agent_routes_total{agent_route_reason="simple"}[15m])) >= 20
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }}: {{ $value | humanizePercentage }} of fast-model turns fail over to the main model"
          description: The fast model is failing; routed turns cost double. Turn routing off until it recovers.
          runbook: infra/monitoring/README.md#fast-model-failing

      - alert: AgentDailySpendHigh
        # Spend limits (PLAN-19 M7, app/limits.py): the store's estimated model spend today
        # crossed 80% of DAILY_SPEND_CAP_USD (guests are now paused) or 100% (the assistant is
        # off until UTC midnight). Counted once per crossing.
        expr: |
          sum by (job, limit) (increase(agent_limit_hits_total{limit=~"store_daily_80|store_daily_100"}[30m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }}: daily spend crossed {{ $labels.limit }}"
          description: >-
            store_daily_80: guests can't chat until UTC midnight. store_daily_100: nobody can.
            Check the Spend limits row for who is spending; raise DAILY_SPEND_CAP_USD only if
            it's real shoppers.
          runbook: infra/monitoring/README.md#spend-limits

      - alert: AgentLimitHitsSpike
        # Many guests hitting their daily or new-chat limit: likely a bot spreading over IPs.
        expr: |
          sum by (job) (increase(agent_limit_hits_total{kind="guest",limit=~"shopper_daily|new_chats"}[15m])) >= 20
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }}: {{ $value }} guest limit hits in 15 min"
          description: Possible bot traffic against the assistant. Limits are holding; see the runbook for next steps.
          runbook: infra/monitoring/README.md#spend-limits

      - alert: AgentProviderBalanceLow
        # DeepSeek is prepaid (app/balance.py polls it every 15 min): at $0 every model call fails.
        # Fires below $2, or below two days of the last day's spend.
        expr: |
          min by (job) (agent_provider_balance_USD) < 2
          or
          min by (job) (agent_provider_balance_USD)
            < 2 * sum by (job) (increase(agent_model_cost_USD_total[1d]))
        for: 15m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }}: model provider balance is ${{ $value | printf \"%.2f\" }}"
          description: Top up the provider account before it reaches $0, or every chat turn fails.
          runbook: infra/monitoring/README.md#spend-limits
